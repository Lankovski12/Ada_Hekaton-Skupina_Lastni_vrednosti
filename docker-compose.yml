# Zagon vsega z enim ukazom:  docker compose up --build
# Aplikacija: http://localhost:8000   ·   API dokumentacija: http://localhost:8000/docs
services:
  zrak:
    build:
      context: .
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}   # iz okolja ali korenske .env (ni v gitu)
    ports:
      - "8000:8000"
    volumes:
      - zrak-db:/app/db                    # baza meritev preživi ponovni zagon
    restart: unless-stopped

volumes:
  zrak-db:
